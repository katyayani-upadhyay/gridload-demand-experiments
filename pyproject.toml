[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridload-demand-experiments"
version = "0.1.0"
description = "Hourly electricity load analytics for Spain and Portugal: dbt on DuckDB, day-ahead forecasting, demand-response A/B analysis, and a lockdown difference-in-differences study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "katyayani", email = "katyayani.ext@gobblecube.ai" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "dbt-core>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
    "lightgbm>=4.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "holidays>=0.50",
    "matplotlib>=3.8",
    "streamlit>=1.50",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/katyayani-upadhyay/gridload-demand-experiments"

[tool.setuptools.packages.find]
include = ["gridload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
