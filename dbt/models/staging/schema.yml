version: 2

models:
  - name: stg_opsd__load_hourly
    description: >
      Long-format hourly load, one row per country and UTC hour. Missing values
      are kept as nulls here so the imputation downstream is visible and tested.
    columns:
      - name: load_hour_key
        data_tests:
          - not_null
          - unique
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ES", "PT"]
      - name: utc_timestamp
        data_tests:
          - not_null
      - name: load_mw
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                inclusive: false
