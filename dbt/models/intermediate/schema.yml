version: 2

models:
  - name: int_load_hourly_local
    description: Hourly load with local time attributes and imputed gaps flagged.
    columns:
      - name: load_hour_key
        data_tests:
          - not_null
          - unique
      - name: country_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('countries')
                field: country_code
      - name: utc_timestamp
        data_tests:
          - not_null
      - name: local_timestamp
        data_tests:
          - not_null
      - name: local_hour
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: day_of_week
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: load_mw
        data_tests:
          - not_null
      - name: is_imputed
        data_tests:
          - not_null
